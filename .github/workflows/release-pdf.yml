name: release-pdf

on:
  push:
    branches:
      - trunk
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build resume
        run: nix build '.#resume'

      - name: Publish PDF release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="resume-pdf"
          pdf_asset="result/aaqa-ishtyaq-resume.pdf"
          build_info_asset="result/aaqa-ishtyaq-resume.build-info.json"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --title "Aaqa Ishtyaq Resume" \
              --notes "Latest PDF resume build from trunk." \
              --latest \
              --target "${GITHUB_SHA}"
            gh release upload "$tag" "$pdf_asset" "$build_info_asset" --clobber
          else
            gh release create "$tag" "$pdf_asset" "$build_info_asset" \
              --title "Aaqa Ishtyaq Resume" \
              --notes "Latest PDF resume build from trunk." \
              --latest \
              --target "${GITHUB_SHA}"
          fi
